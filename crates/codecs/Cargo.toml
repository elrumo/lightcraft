[package]
name = "lightcraft-codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft standard image codecs: sniffing, decode to linear light, ICC, encoders (L1)"

[lints]
workspace = true

[dependencies]
lightcraft-geom = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
craft-gainmap = { workspace = true }
craft-cms = { workspace = true }
craft-jpeg = { workspace = true }
craft-image-codecs = { workspace = true }
craft-metadata = { workspace = true }
craft-tiff = { workspace = true }
craft-gif = { workspace = true }
craft-psd = { workspace = true }
craft-heif = { workspace = true, optional = true, features = ["decode"] }
serde = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }
craft-jxl = { workspace = true, optional = true }

jxl-oxide = { workspace = true, optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-video = { workspace = true, optional = true }
craft-avif-encode = { workspace = true, optional = true }

avif-serialize = { workspace = true, optional = true }
rav1e = { workspace = true, optional = true }
ravif = { workspace = true, optional = true }
[features]
default = ["parallel", "jxl", "avif", "heif"]
parallel = ["dep:rayon", "lightcraft-raster/parallel", "craft-jpeg/parallel"]
## JPEG XL decoding and encoding via the shared craft-jxl codec.
jxl = ["dep:craft-jxl", "dep:jxl-oxide"]
# HEIC/HEIF decode via the optional craft-heif crate (heic-rs, pure Rust). This fork enables it by
# default because phone imports need HEIC support; `--no-default-features` opts out (HEVC patent
# policy stays with distributors).
heif = ["dep:craft-heif"]
## AVIF/AV1 encoding via craft-image-codecs / craft-video (pure Rust). Native targets only; a no-op on wasm32.
avif = ["dep:craft-video", "dep:craft-avif-encode"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
# JPEG parity tests and the benchmark use the prior/reference encoder only in development.
jpeg-encoder = { workspace = true }
proptest = { workspace = true }
# Lossless synthetic HEIC files for the `heif` feature's tests.
craft-heif = { workspace = true, features = ["testdata"] }

jxl-oxide = { workspace = true }
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dhat = { workspace = true }
