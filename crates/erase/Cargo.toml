[package]
name = "lightcraft-erase"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft AI Remove: MI-GAN inpainting on rten, pure Rust, native and web (L3)"

[lints]
workspace = true

[dependencies]
lightcraft-raster = { workspace = true }
# `onnxfix` only (no model runtime of its own; builds for the web)
lightcraft-vision = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
# pure Rust ONNX runtime, as in lightcraft-vision; it builds for wasm32 too
rten = { version = "0.24", default-features = false, features = ["onnx_format"] }
rten-tensor = "0.24"
