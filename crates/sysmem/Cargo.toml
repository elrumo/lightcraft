[package]
name = "lightcraft-sysmem"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft sysmem (L0): returns freed allocator memory to the OS, says how much memory iOS leaves the app, and an allocator that gives large blocks back at once. Allowed `unsafe` for its libSystem calls (see CLAUDE.md, Never crash)."

# Opts out of the workspace lints only to keep `unsafe_code = "deny"` overridable for the FFI
# modules below; every other crate root has `#![forbid(unsafe_code)]`. See AGENTS.md and craftrules
# standards/never-crash.md ("isolated helper library crate").
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
