[package]
name = "lightcraft-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft RAW decoding, demosaicing and DNG colour model (L1)"

[lints]
workspace = true

[dependencies]
craft-tiff = { workspace = true }
craft-raw = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-geom = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
miniz_oxide = { workspace = true }
craft-image-codecs = { workspace = true }

[features]
## `lightcraft_raw::testdata`: synthetic VC-5 (GoPro GPR) streams and Olympus and Panasonic files for other crates' tests
## (made by craft-raw's own `testdata` feature, where the decoders they test live).
testdata = ["craft-raw/testdata"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
proptest = { workspace = true }
zune-jpegxl = { workspace = true }
zune-core = { workspace = true }
# decoding and writing camera JPEGs in the fork's corpus and DNG tests (test-only)
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
# Pinned CC0 corpus identities; not a product dependency.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# Peak-heap regression tests (tests/sr2_heap.rs); not a product dependency.
dhat = { workspace = true }
