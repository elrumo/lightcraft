[package]
name = "lightcraft-enhance"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft neural enhancement (AI super resolution) on candle, pure Rust (L3)"

[lints]
workspace = true

[dependencies]
lightcraft-raster = { workspace = true }
thiserror = { workspace = true }

# the models run natively only (the web build has no AI models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
lightcraft-fetch = { workspace = true }
# AI Remove's model is downloaded and managed with these (its pin lives with the eraser)
lightcraft-erase = { workspace = true }
# so is Lens Blur's depth model (its pin lives with the estimator)
lightcraft-depth = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[dev-dependencies]
lightcraft-codecs = { workspace = true }
lightcraft-color = { workspace = true }
