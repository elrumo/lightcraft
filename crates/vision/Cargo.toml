[package]
name = "lightcraft-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft photo understanding: image-text search embeddings and their on-disk index (L3)"

[lints]
workspace = true

[dependencies]
half = { workspace = true }
siphasher = { workspace = true }
thiserror = { workspace = true }

# the models run natively only (the web build has no AI)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
lightcraft-fetch = { workspace = true }
lightcraft-raster = { workspace = true }
serde_json = { workspace = true }
# pure Rust: no `onig` (C), no `esaxx_fast` (C++); `unstable_wasm` swaps Oniguruma for fancy-regex
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[dev-dependencies]
image = { workspace = true }
