[package]
name = "lightcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
craft-plist = { workspace = true }
craft-pdf-print.workspace = true
craft-mime = { workspace = true }
# Paths stored in a Lightroom catalog are followed only to local files or the catalog's share.
craft-docpath = { workspace = true }
lightcraft-geom = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-scenes = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-gpu = { workspace = true }
lightcraft-catalog = { workspace = true }
web-time = { workspace = true }
lightcraft-preview = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raw = { workspace = true }
lightcraft-denoise-core = { workspace = true }
lightcraft-denoise = { workspace = true, optional = true }
lightcraft-meta = { workspace = true }
lightcraft-lensdb = { workspace = true }
lightcraft-faces = { workspace = true }
miniz_oxide = { workspace = true }
# CRC-32 of a catalog unpacked from a Lightroom backup zip (lightroom_backup.rs).
crc32fast = { workspace = true }
lightcraft-merge = { workspace = true }
lightcraft-geocode = { workspace = true }
lightcraft-slideshow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.13", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
lightcraft-segment = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
argon2 = { workspace = true }
base64 = { workspace = true }
half = { workspace = true }
lightcraft-depth = { workspace = true }
lightcraft-diffuse = { workspace = true, optional = true }
lightcraft-enhance = { workspace = true, optional = true }
lightcraft-erase = { workspace = true }
lightcraft-geo = { workspace = true }
lightcraft-sysmem = { workspace = true }
lightcraft-video = { workspace = true }
lightcraft-vision = { workspace = true }
sha2 = { workspace = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lightcraft-fetch = { workspace = true }
ureq = { workspace = true }
rustls-rustcrypto = { workspace = true }
libc = { workspace = true }
# capture-time parsing for face recognition (native only)
chrono = { workspace = true }
# free space of the drive holding the preview cache (the low-disk alert; pure Rust: rustix / windows-sys)
fs4 = { workspace = true }
[target.'cfg(target_arch = "wasm32")'.dependencies]
# argon2's password-hash dependency uses rand_core 0.6 on wasm.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:lightcraft-segment"]
denoise = ["dep:lightcraft-denoise", "lightcraft-denoise/runtime", "lightcraft-gpu/denoise"]
rawnind-model = ["denoise", "lightcraft-denoise/rawnind-model", "lightcraft-denoise-core/rawnind-model"]
# Keep the fork's app feature names as aliases over the current engine dependencies.
testdata = ["lightcraft-raw/testdata"]
vision = ["lightcraft-vision/siglip", "lightcraft-vision/onnx", "lightcraft-depth/gpu"]
enhance = ["dep:lightcraft-enhance", "dep:lightcraft-diffuse"]

[dev-dependencies]
# Construct RAW errors using the same TIFF package as craft-raw.
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
lightcraft-vision = { workspace = true, features = ["testing"] }
# HDR JPEG XL tests read the file's colour encoding
craft-jxl = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
craft-heif = { workspace = true, features = ["testdata"] }
craft-tiff = { workspace = true }
jxl-oxide = { workspace = true }
lightcraft-raw = { workspace = true, features = ["testdata"] }
lightcraft-sysmem = { workspace = true }
lightcraft-video = { workspace = true, features = ["testdata"] }
