[package]
name = "lightcraft-ui-egui"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
description = "LightCraft egui frontend (Lightroom-style UI); swappable — nothing below depends on it (L5)"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
lightcraft-geom = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-geo = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-catalog = { workspace = true }
web-time = { workspace = true }
lightcraft-engine = { workspace = true }
lightcraft-preview = { workspace = true }
egui = { workspace = true }
# decoding the thumbnails a camera makes (the import review of a camera, `camera_import`)
lightcraft-codecs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# cameras, phones and cards through ImageCaptureCore (`camera_import::system_cameras`)
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
lightcraft-capture = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
lightcraft-denoise = { workspace = true, features = ["runtime"] }
lightcraft-enhance = { workspace = true }
lightcraft-vision = { workspace = true, features = ["testing"] }
lightcraft-faces = { workspace = true }
lightcraft-merge = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
