[package]
name = "lightcraft-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LightCraft on iOS: the egui app as a static library, linked into an app by the Xcode project in xcode/ (docs/ios.md)"

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
lightcraft-engine = { workspace = true }
lightcraft-ui-egui = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-sysmem = { workspace = true }
lightcraft-ios-host = { workspace = true }
serde_json = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui = { workspace = true }
log = { workspace = true }
