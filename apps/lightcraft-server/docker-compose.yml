# LightCraft sync server behind Caddy (automatic HTTPS certificates). See docs/sync.md.
#
#   1. Point a DNS name at this machine (photos.example.com) with ports 80 and 443 reachable.
#   2. cd apps/lightcraft-server
#      LIGHTCRAFT_DOMAIN=photos.example.com LIGHTCRAFT_PHOTOS=/srv/photos docker compose up -d --build
#   3. docker compose logs lightcraft     (shows the one-time setup code)
#      Open https://photos.example.com/admin, enter the code, create your admin account, add users.
#      (Or from the command line: docker compose exec -it lightcraft lightcraft-server user add ann)
#   4. Photos already on this machine: on the admin page, Users › Folders, add /photos/<folder> to a
#      user (LIGHTCRAFT_PHOTOS is mounted at /photos, read-only: nothing there is copied or changed).
#   5. In LightCraft: Settings > Sync, server https://photos.example.com, user ann, the password.
#      In a browser: open https://photos.example.com.
#
# Everything the server keeps is in the lightcraft-data volume (users, libraries, photo files and
# previews); the photo folders stay where they are.

services:
  lightcraft:
    build:
      context: ../..
      dockerfile: apps/lightcraft-server/Dockerfile
    image: lightcraft-server
    restart: unless-stopped
    environment:
      LIGHTCRAFT_LOG: info
      # minutes between scans of the library folders (0: at start and from the admin page only)
      LIGHTCRAFT_SCAN_INTERVAL: "15"
    volumes:
      - lightcraft-data:/data
      # photo folders already on this machine, read in place (must be readable by uid 10001). To let the server
      # write XMP sidecars there, or file uploaded photos into one, change :ro to :rw (writable by uid 10001) and
      # turn it on in the admin page (Users > the user > Library folders > Writing)
      - ${LIGHTCRAFT_PHOTOS:-./photos}:/photos:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      lightcraft:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LIGHTCRAFT_DOMAIN: ${LIGHTCRAFT_DOMAIN:?set LIGHTCRAFT_DOMAIN to this server's domain name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  lightcraft-data:
  caddy-data:
  caddy-config:
