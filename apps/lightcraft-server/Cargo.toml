[package]
name = "lightcraft-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LightCraft sync server: each user's library, shared by their devices (self-hosted, see docs/sync.md)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lightcraft-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lightcraft-catalog = { workspace = true }
lightcraft-preview = { workspace = true }
# reading photos found in library folders: describing them, their XMP sidecars, their previews
lightcraft-engine = { workspace = true }
# search by description: the model (SigLIP 2 on candle), reading the text in photos (PP-OCRv6 on rten) and each user's indexes of photo vectors and text
lightcraft-vision = { workspace = true, features = ["siglip", "onnx"] }
httparse = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
lightcraft-codecs = { workspace = true }
lightcraft-vision = { workspace = true, features = ["siglip", "onnx", "testing"] }
lightcraft-raster = { workspace = true }
ureq = { workspace = true }
