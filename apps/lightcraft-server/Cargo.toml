[package]
name = "lightcraft-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LightCraft sync server: each user's library, shared by their devices (self-hosted, see docs/sync.md)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lightcraft-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lightcraft-catalog = { workspace = true }
lightcraft-preview = { workspace = true }
tiny_http = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
lightcraft-engine = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
ureq = { workspace = true }
