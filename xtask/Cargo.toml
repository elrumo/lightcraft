[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
# precompressed web bundle (`cargo xtask web`); pure Rust
flate2 = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
# `cargo xtask geodata`: compact place and coastline files for crates/geo. Pure Rust.
miniz_oxide = { workspace = true }
earcutr = "0.4"
# the generator builds the name table with the very normalisation the app reads it with
lightcraft-geo = { workspace = true }
